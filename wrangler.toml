name = "uptime"
main = "src/index.ts"
compatibility_date = "2026-10-20"

[observability]
enabled = true

# Each minute. A monitor with a longer interval skips the runs between.
[triggers]
crons = ["* * * * *"]

# Holds one key, "config". Create it in phase 0: npx wrangler kv namespace create uptime-config
[[kv_namespaces]]
binding = "CONFIG"
id = "e448eed6c9ed43089f9d5856c7346451"

# The heartbeat goes to the dead-mans-switch Worker. A Worker cannot fetch another
# Worker on workers.dev by URL, so it needs a service binding. See src/heartbeat.ts.
[[services]]
binding = "DMS"
service = "dms"

# One data point for each check result, kept for 3 months. See src/history.ts.
# The free limit is 100,000 points per day. 14 monitors in 3 regions write about 54,000.
[[analytics_engine_datasets]]
binding = "HISTORY"
dataset = "uptime_results"

# One object for each region, named "probe-<region>".
[[durable_objects.bindings]]
name = "PROBE"
class_name = "Probe"

# One object, named "state". It holds the up or down state and sends the alerts.
[[durable_objects.bindings]]
name = "STATE"
class_name = "State"

# The free plan accepts only SQLite-backed Durable Objects.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Probe", "State"]
